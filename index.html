<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Universe Madness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen portrait card table. Dark tabletop, brass trim, muted universe colours as thin accents. */
:root{
  --bg:#0e1014; --bg2:#171a20; --panel:#1b1e25; --line:#2d323c;
  --fg:#e9e4d8; --mut:#8e897d;
  --brass:#c9a45c; --brass2:#8f723a;
  --hp:#c8453f; --atk:#d18a3c; --mana:#5b8fd1; --ok:#6fae7a;
  --lotr:#557447; --sw:#3f6684; --marvel:#8c3b38; --naruto:#a8622c; --neutral:#5f5674;
  --rC:#b9b4a6; --rR:#5b8fd1; --rE:#9a6cc7; --rL:#c9a45c;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--fg);font-family:var(--body);
  background-color:var(--bg);
  background-image:radial-gradient(110% 70% at 50% 45%,var(--bg2),var(--bg) 75%);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{height:100%;max-width:520px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:13px 18px;border-radius:6px;
  border:1px solid #e3c88d55;background:linear-gradient(180deg,#d4b46f,#a8843f);color:#16120a;box-shadow:inset 0 1px 0 #fff4,0 2px 6px #0008}
.btn:active{filter:brightness(.92);transform:translateY(1px)}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line);box-shadow:inset 0 1px 0 #ffffff08}
.btn[disabled]{opacity:.4}
.ib{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:18px;display:grid;place-items:center;flex:none}
.cur{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
.cur i{font-style:normal;color:#b9a6d6}

/* ---------- screens ---------- */
.scr{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px}
.scr .body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.scr .body>*{flex:none}
.hdr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.hdr h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:0;flex:1;min-width:0}

.menu{justify-content:center;align-items:stretch;gap:24px}
.logo{text-align:center;line-height:.9}
.logo .u{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.6em;padding-left:.6em;color:var(--brass)}
.logo .m{display:block;font-family:var(--display);font-weight:700;font-size:clamp(52px,17vw,78px);letter-spacing:.04em;color:var(--fg);margin-top:4px;text-shadow:0 3px 0 #000}
.logo .bars{display:flex;justify-content:center;gap:4px;margin-top:12px}
.logo .bars i{width:34px;height:3px}
.logo .bars i:nth-child(1){background:var(--lotr)}.logo .bars i:nth-child(2){background:var(--sw)}
.logo .bars i:nth-child(3){background:var(--marvel)}.logo .bars i:nth-child(4){background:var(--naruto)}
.tag{text-align:center;color:var(--mut);font-size:15px;margin:0;text-wrap:balance}
.mbtns{display:flex;flex-direction:column;gap:10px}
.stats{display:flex;justify-content:center;gap:18px;color:var(--mut);font-size:13px;letter-spacing:.04em}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:13px;text-align:center;margin:0}

.leaders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 10px;border-radius:8px;border:1px solid var(--line);border-top:3px solid var(--u);background:var(--panel);text-align:center}
.lt .lp{position:relative;overflow:hidden;font-size:36px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--u) 60%,#000),#0b0c10);border:2px solid var(--brass2)}
.lt b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em}
.lt small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.lt em{font-style:normal;color:var(--brass);font-weight:600;font-size:13px}
.lt span:last-child{font-size:12px;color:var(--fg);opacity:.8}

.worlds{display:flex;flex-direction:column;gap:10px}
.wt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--u);background:var(--panel)}
.wt .lp{position:relative;overflow:hidden;flex:none;font-size:32px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--u) 60%,#000),#0b0c10);border:2px solid var(--brass2)}
.wt .lp .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;border-radius:50%}
.wt .wi{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;line-height:1.35}
.wt small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.wt b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em}
.wt em{font-style:normal;color:var(--brass);font-weight:600}
.wt .wp b{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0}
.wt .wp{color:var(--mut)}
.wt .bad{color:#ff7a72;font-weight:600}
.wt[aria-disabled="true"]{opacity:.7}
.rules{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.45}
.rules section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.rules h3{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;margin:0 0 6px;color:var(--brass)}
.rules p{margin:0 0 6px}.rules ul{margin:0;padding-left:18px}

/* ---------- card face ---------- */
.card{position:relative;width:7em;height:9.8em;flex:none;border-radius:.35em;overflow:hidden;color:var(--fg);
  background:linear-gradient(180deg,#20232b,#121419);
  border:.1em solid color-mix(in srgb,var(--u) 60%,#000);box-shadow:inset 0 0 0 .05em #ffffff12,0 .2em .5em #000a}
.card.sm{font-size:9.15px}.card.mm{font-size:11.4px}.card.md{font-size:15px}.card.lg{font-size:32px}
.card::before{content:"";position:absolute;left:.35em;right:.35em;top:.35em;height:4.9em;border-radius:.2em;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--u) 75%,#000),color-mix(in srgb,var(--u) 22%,#08090c) 80%);box-shadow:inset 0 0 .6em #000c}
.card .art{position:absolute;left:.35em;top:.35em;width:calc(100% - .7em);height:4.9em;object-fit:cover;object-position:center 22%;border-radius:.2em;z-index:1}
.unit .art,.por .art,.lt .lp .art{object-position:center 22%}
.card.has-art .ci{display:none}
.card .cost{position:absolute;top:.15em;left:.15em;width:1.45em;height:1.45em;border-radius:50%;display:grid;place-items:center;z-index:3;
  font-family:var(--display);font-weight:700;font-size:1.05em;color:#dbe8fa;background:radial-gradient(circle at 40% 35%,#2f4f78,#121c2b);border:.06em solid var(--brass)}
.card .gem{position:absolute;bottom:.42em;left:50%;margin-left:-.25em;width:.5em;height:.5em;transform:rotate(45deg);z-index:2;border:.05em solid #000}
.r-C .gem{background:var(--rC)}.r-R .gem{background:var(--rR)}.r-E .gem{background:var(--rE)}.r-L .gem{background:var(--rL)}
.card.r-L{border-color:var(--brass);box-shadow:inset 0 0 0 .05em #e8cf9a44,0 0 .5em #c9a45c55}
.card .ci{position:absolute;left:0;right:0;top:.42em;font-size:3em;line-height:1;text-align:center;z-index:1;filter:saturate(.75) drop-shadow(0 .05em .08em #000a)}
.card .cn{position:absolute;left:.15em;right:.15em;top:6.75em;font-size:.78em;font-weight:600;line-height:1.08;text-align:center;max-height:2.2em;overflow:hidden;z-index:2}
.card::after{content:"";position:absolute;left:.6em;right:.6em;top:5.4em;height:.05em;background:var(--u);opacity:.9}
.card .ct,.card .cu{display:none}
.card.lg .cn{font-family:var(--display);font-weight:700;letter-spacing:.03em;font-size:.62em;top:8.95em;max-height:1.2em;white-space:nowrap;text-overflow:ellipsis}
.card.lg .ct{display:grid;place-items:center;position:absolute;left:.6em;right:.6em;top:15.6em;height:4.7em;font-size:.42em;line-height:1.25;text-align:center;color:#d8d2c4;padding:0 .4em}
.card.lg .cu{display:block;position:absolute;left:.6em;right:.6em;top:22.6em;font-size:.27em;letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-align:center;color:var(--mut);z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cost.low{color:#a8e0b2;border-color:var(--ok)}
.card .ca,.card .ch{position:absolute;bottom:.15em;width:1.45em;height:1.45em;border-radius:50%;display:grid;place-items:center;z-index:3;
  font-family:var(--display);font-weight:700;font-size:1.05em;background:#101216;color:#fff}
.card .ca{left:.15em;border:.08em solid var(--atk)}
.card .ch{right:.15em;border:.08em solid var(--hp)}
.card .sp{position:absolute;left:50%;bottom:2.1em;transform:translateX(-50%);font-size:.48em;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--mut);white-space:nowrap}
.card.back{background:repeating-linear-gradient(45deg,#1a1d24 0 .3em,#15171d .3em .6em);border-color:var(--brass2)}
.card.back::before{inset:.45em;height:auto;background:none;border:.05em solid var(--brass2);box-shadow:none}
.card.back::after{display:none}
.card.back .bk{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;letter-spacing:.1em;font-size:1.7em;color:var(--brass)}

/* ---------- game ---------- */
.game{height:100%;display:grid;grid-template-rows:auto minmax(84px,1fr) auto minmax(84px,1fr) auto 100px;gap:6px;padding-block:6px;touch-action:none}
.lb{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 2px}
.por{position:relative;width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--u) 65%,#000),#0b0c10);border:2px solid var(--brass2)}
.por .art,.lt .lp .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.por .hp{position:absolute;right:-7px;bottom:-5px;min-width:26px;height:24px;padding:0 5px;border-radius:5px;background:#101216;border:1px solid var(--hp);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;display:grid;place-items:center;font-variant-numeric:tabular-nums;z-index:2}
.por .ar{position:absolute;left:-7px;bottom:-5px;min-width:24px;height:24px;border-radius:5px;background:#101216;border:1px solid #a9a598;color:#fff;font-family:var(--display);font-weight:700;font-size:14px;display:grid;place-items:center;z-index:2}
.li{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.li b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mana{display:flex;align-items:center;gap:3px;flex-wrap:nowrap}
.mana b{font-family:var(--display);font-weight:700;font-size:14px;color:#9cbbe3;margin-right:3px;font-variant-numeric:tabular-nums}
.mana i{width:7px;height:7px;transform:rotate(45deg);background:#ffffff10;flex:none}
.mana i.f{background:var(--mana)}
.mana i.e{background:#5b8fd140}
.mad{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mad.on{color:#d7a3c2}
.pow{margin-left:auto;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 10px;border-radius:6px;border:1px solid var(--brass);background:var(--panel);max-width:118px}
.pow span{font-size:12px;font-weight:600;line-height:1.1;text-align:center}
.pow i{font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;color:#9cbbe3}
.pow[disabled]{opacity:.35;border-color:var(--line)}
.epow{margin-left:auto;font-size:11px;color:var(--mut);text-align:right;max-width:100px}

.board{display:flex;justify-content:center;align-items:center;gap:6px;border-radius:8px;padding:6px;min-width:0;position:relative;
  background:#ffffff05;border:1px solid #ffffff0c}
.board.mine{background:#ffffff07}
.board.drop{outline:1px dashed var(--brass);outline-offset:-4px}
.board .empty{color:#ffffff2a;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--display);font-weight:600}
.unit{position:relative;width:58px;height:76px;flex:none;border-radius:6px;overflow:visible;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--u) 70%,#000),color-mix(in srgb,var(--u) 20%,#0b0c10) 85%);
  border:1px solid color-mix(in srgb,var(--u) 55%,#000);box-shadow:inset 0 0 0 1px #ffffff12,0 3px 8px #000a;transition:transform .15s}
.unit .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:5px}
.unit .ui{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:26px;line-height:1;filter:saturate(.75) drop-shadow(0 1px 1px #000a)}
.unit.has-art .ui{display:none}
.unit .nm{position:absolute;left:0;right:0;bottom:15px;font-size:9px;font-weight:600;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;text-shadow:0 1px 2px #000}
.unit .at,.unit .hpx{position:absolute;bottom:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;background:#101216;color:#fff;z-index:2}
.unit .at{left:-5px;border:1px solid var(--atk)}.unit .hpx{right:-5px;border:1px solid var(--hp)}
.unit .at.up,.unit .hpx.up{color:#a8e0b2}
.unit .hpx.hurt{color:#ff9a94}
.unit.taunt{border:2px solid #b8b3a6;border-radius:6px 6px 20px 20px}
.unit.taunt .art{border-radius:4px 4px 18px 18px}
.unit .kw{position:absolute;top:-6px;right:-5px;font-size:11px;z-index:2}
.unit .web{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;background:#ffffff26;border-radius:inherit;z-index:2}
.unit.ready{box-shadow:0 0 0 2px var(--ok),0 0 10px color-mix(in srgb,var(--ok) 60%,transparent)}
.unit.sel{transform:translateY(-7px);box-shadow:0 0 0 2px var(--brass),0 0 14px var(--brass)}
.tgt{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--hp),0 0 4px var(--hp)}50%{box-shadow:0 0 0 3px var(--hp),0 0 14px var(--hp)}}

.mid{display:flex;align-items:center;gap:8px;min-height:44px;border-block:1px solid var(--line);padding-block:4px}
.mid .log{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .pend{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--brass)}
.endb{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;padding:9px 14px;border-radius:6px;border:1px solid #e3c88d55;background:linear-gradient(180deg,#d4b46f,#a8843f);color:#16120a;flex:none}
.endb.hot{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px var(--brass)}}
.endb[disabled]{background:var(--panel);color:var(--mut);border-color:var(--line)}
.smallb{font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);flex:none;font-weight:600}

.hand{display:flex;justify-content:center;align-items:flex-end;padding-bottom:4px;position:relative}
.hc{position:relative;transition:transform .15s,opacity .15s}
.hc.ok{transform:translateY(-6px)}
.hc.ok .card{box-shadow:0 0 0 2px var(--ok),0 0 10px color-mix(in srgb,var(--ok) 55%,transparent)}
.hc.lift{opacity:.2}

.pop{position:absolute;left:50%;top:20%;transform:translate(-50%,var(--d,0px));font-family:var(--display);font-weight:700;font-size:22px;color:#ff6b62;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;pointer-events:none;z-index:6;animation:up 1s ease-out forwards}
.pop.heal{color:#8fd49b}.pop.info{color:var(--brass);font-size:14px;letter-spacing:.04em}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
.hit{animation:shake .3s}
@keyframes shake{25%{translate:-4px 0}50%{translate:4px 0}75%{translate:-2px 0}}

.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 18px #000c)}
.arrow{position:fixed;inset:0;width:100%;height:100%;z-index:59;pointer-events:none}
.banner{position:fixed;left:0;right:0;top:42%;z-index:70;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:28px;color:var(--fg);pointer-events:none;animation:ban 1.3s ease forwards;
  background:linear-gradient(90deg,transparent,#000c 25%,#000c 75%,transparent);padding:10px 0;border-block:1px solid #c9a45c66}
@keyframes ban{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:80;background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:6px;font-size:14px;max-width:88vw;text-align:center;animation:ban 2s ease forwards;pointer-events:none}

.ov{position:fixed;inset:0;z-index:50;background:#07080bE6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.ov p{margin:0;color:var(--mut);font-size:14px}
.ov h2{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:40px;margin:0;color:var(--fg)}
.ov .col{display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
.modal{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(340px,100%)}
.mbt{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.mbt .btn{font-size:14px;padding:11px 8px}

/* ---------- collection & packs ---------- */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.tabs button.on{border-color:var(--brass);color:var(--brass);background:#c9a45c14}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;padding:6px 11px;border-radius:4px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600}
.chips button.on{border-color:var(--fg);background:#ffffff12}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;justify-items:center}
.tile{position:relative;background:none;border:0;padding:0}
.tile.locked .card{filter:grayscale(1) brightness(.4)}
.tile .own{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .ind{position:absolute;top:-6px;right:-4px;background:var(--brass);color:#16120a;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
.drows{display:flex;flex-direction:column;gap:5px}
.drow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--u)}
.drow .dc{width:24px;height:24px;border-radius:50%;background:#121c2b;border:1px solid var(--brass2);color:#dbe8fa;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;flex:none}
.drow .dn{flex:1;min-width:0;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dx{font-weight:600;color:var(--brass);font-variant-numeric:tabular-nums}
.drow .ib{width:32px;height:32px;font-size:16px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dhead b{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:19px}
.dhead b.bad{color:#ff7a72}

.shop{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:10px}
.shop h3{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 0;font-size:22px}
.prow{display:flex;justify-content:center;gap:8px}
.slot{position:relative;background:none;border:0;padding:0}
.slot .badge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.new{background:var(--ok);color:#0b1a0e}.badge.dup{background:#b9a6d6;color:#20123a}
.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.slot.pick .card{box-shadow:0 0 0 2px var(--brass),0 0 16px var(--brass)}
.sec-t{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px;margin:4px 0 0;text-align:center;color:var(--brass)}
.ptxt{min-height:38px;text-align:center;font-size:14px;color:var(--fg);margin:0}
.ptxt b{color:var(--brass)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

function fxText(p){
  const n=p.n;
  switch(p.fx){
    case 'dmg':
      if(n==='force')return 'Tyle obrażeń we wrogiego Lidera, ile masz Mocy';
      if(p.plusClones)return `${n} ${dmgWord(n)} we wrogą jednostkę (+1 za każdego twojego Klona)`;
      return ({enemyLeader:`${n} ${dmgWord(n)} we wrogiego Lidera`,allEnemyUnits:`${n} ${dmgWord(n)} we wszystkie wrogie jednostki`,allEnemies:`${n} ${dmgWord(n)} we wszystkich wrogów`,enemyUnit:`${n} ${dmgWord(n)} we wrogą jednostkę`,any:`${n} ${dmgWord(n)} w dowolny cel`})[p.t];
    case 'heal': return p.t==='myLeader'?`Leczy twojego Lidera o ${n}`:p.t==='allFriendlyUnits'?`Leczy twoje jednostki o ${n}`:`Leczy cel o ${n}`;
    case 'buff': return `Twoja jednostka dostaje +${p.a}/+${p.h}${p.kw==='charge'?' i Szarżę':''}`;
    case 'buffAll': return `Twoje jednostki dostają +${p.a}/+${p.h}`;
    case 'buffClones': return `Twoje Klony dostają +${p.a}/+${p.h}`;
    case 'selfBuff': return `Dostaje +${p.a}/+${p.h}`;
    case 'selfKw': return 'Dostaje Szarżę';
    case 'summon': {const t=TOKENS[p.token];return `Przyzywa ${n>1?n+'× ':''}${t.name} ${t.atk}/${t.hp}`}
    case 'draw': return 'Dobierasz kartę';
    case 'destroy': return 'Niszczy wrogą jednostkę';
    case 'freeze': return 'Wroga jednostka nie zaatakuje w następnej turze';
    case 'armor': return `+${n} Pancerza dla twojego Lidera`;
    case 'wipeEnemy': return 'Niszczy wszystkie wrogie jednostki';
    case 'wipe': return 'Niszczy WSZYSTKIE jednostki na stole';
    case 'snap': return 'Niszczy losową połowę pozostałych jednostek';
  } return '';
}
function cardText(c){
  const parts=[];
  if(c.force)parts.push('<b>✦ +1 Mocy</b>');
  if(c.kw&&c.kw.includes('charge'))parts.push('<b>Szarża</b>');
  if(c.kw&&c.kw.includes('taunt'))parts.push('<b>Prowokacja</b>');
  if(c.costMod==='clones')parts.push('Kosztuje 1 mniej za każdego twojego Klona');
  if(c.play)parts.push(c.type==='unit'?`<span><b>Okrzyk:</b> ${fxText(c.play)}.</span>`:fxText(c.play)+'.');
  if(c.cond)parts.push(`<span><b>${COND[c.cond.type]}${c.cond.type==='force'?' '+c.cond.n:''}:</b> ${fxText(c.cond.play)}.</span>`);
  return parts.join(' · ');
}
const cardLabel = c=>[WORLDS[c.world].n,c.race,c.src&&SRC[c.src],RAR[c.rarity]&&RAR[c.rarity].n].filter(Boolean).join(' · ');
function cardFace(c,size,extra='',cost){
  const u=c.type==='unit', a=artSrc(c), k=cost===undefined?c.cost:cost;
  return `<div class="card ${size} r-${c.rarity} ${a?'has-art':''}" style="--u:var(--${c.world})">${a?artImg(a):''}
    <span class="cost ${k<c.cost?'low':''}">${k}</span><span class="gem"></span>
    <span class="cu">${cardLabel(c)}</span>
    <span class="ci">${c.icon}</span><span class="cn">${c.name}</span>
    <span class="ct">${cardText(c)||'Bez efektu. Czysta siła.'}</span>
    ${u?`<span class="ca">${c.atk}</span><span class="ch">${c.hp}</span>`:`<span class="sp">Zaklęcie</span>`}${extra}</div>`;
}

const ART_KEY='universe-madness-art-v1';

function artSrc(c){if(!c)return null;if(c.art)return c.art===true?`art/${c.id}.webp`:c.art;return ART[c.id]||null}
const artImg=a=>`<img class="art" src="${a}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-art');this.remove()">`;
async function fetchJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
let HEROES=null;
async function findArt([src,q]){
  if(src==='wiki'){const d=await fetchJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);return (d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||''}
  if(src==='hero'){if(!HEROES)HEROES=await fetchJSON('https://cdn.jsdelivr.net/gh/akabab/superhero-api@0.3.0/api/all.json');
    const h=HEROES.find(x=>x.name.toLowerCase()===q.toLowerCase());return h?h.images.lg||h.images.md:''}
  if(src==='jikan'){await sleep(450);const d=await fetchJSON(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(q)}&order_by=favorites&sort=desc&limit=1`);
    const c=d.data&&d.data[0];return c?(c.images.webp&&c.images.webp.image_url)||c.images.jpg.image_url:''}
  return '';
}
const ART_STATUS={busy:false,done:0,total:0};
let artTimer=null;
function artRefresh(){clearTimeout(artTimer);artTimer=setTimeout(()=>{if(!drag&&screen!=='game')render()},350)}
async function resolveArt(){
  const todo=Object.entries(ART_SRC).filter(([id])=>ART[id]===undefined);
  if(!todo.length)return;
  Object.assign(ART_STATUS,{busy:true,done:0,total:todo.length});artRefresh();
  for(const [id,spec] of todo){
    try{ART[id]=await findArt(spec);try{localStorage.setItem(ART_KEY,JSON.stringify(ART))}catch(e){}}
    catch(e){/* offline albo limit API: spróbuje przy następnym uruchomieniu */}
    ART_STATUS.done++;artRefresh();
  }
  ART_STATUS.busy=false;artRefresh();
}
const artNote=()=>ART_STATUS.busy?`<p class="note">Pobieram grafiki ${ART_STATUS.done}/${ART_STATUS.total}…</p>`:'';

const KEY='universe-madness-save-v2';
function starterDeckOf(w){const d=[];CARDS.forEach(c=>{if(c.world===w)for(let i=0;i<(c.starter||0);i++)d.push(c.id)});return d}
function defaultSave(){
  const coll={},decks={};
  CARDS.forEach(c=>{if(c.starter)coll[c.id]=c.starter});
  PLAYABLE.forEach(w=>decks[w]=starterDeckOf(w));
  const s={shards:300,dust:0,coll,decks,wins:0,losses:0};
  try{const old=JSON.parse(localStorage.getItem('universe-madness-save-v1'));
    if(old){s.shards=Math.max(s.shards,old.shards||0);s.dust=old.dust||0;s.wins=old.wins||0;s.losses=old.losses||0;
      Object.entries(old.coll||{}).forEach(([id,n])=>{if(CARD[id])s.coll[id]=Math.max(s.coll[id]||0,Math.min(n,RAR[CARD[id].rarity].max))})}}catch(e){}
  return s;
}
let S=null;

if(!S||!S.coll||!S.decks)S=defaultSave();
PLAYABLE.forEach(w=>{S.decks[w]=(S.decks[w]||[]).filter(id=>CARD[id])});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const owned=id=>S.coll[id]||0;
const inDeck=(id,w)=>S.decks[w].filter(x=>x===id).length;
const deckMax=id=>Math.min(owned(id),RAR[CARD[id].rarity].max);
const neutralCount=w=>S.decks[w].filter(id=>CARD[id].world==='neutral').length;
const deckOk=w=>S.decks[w].length===RULES.deckSize&&neutralCount(w)<=RULES.neutralMax;
function canAddTo(id,w){const c=CARD[id];if(c.world!==w&&c.world!=='neutral')return false;if(inDeck(id,w)>=deckMax(id)||S.decks[w].length>=RULES.deckSize)return false;if(c.world==='neutral'&&neutralCount(w)>=RULES.neutralMax)return false;return true}

/* ---------- paczki (w stylu Gwinta) ---------- */
function rollId(min){
  const w=min==='R'?[['R',70],['E',24],['L',6]]:[['C',70],['R',22],['E',7],['L',1]];
  let r=Math.random()*w.reduce((s,x)=>s+x[1],0), rar=w[0][0];
  for(const [k,v] of w){if(r<v){rar=k;break}r-=v}
  return pick(CARDS.filter(c=>c.rarity===rar)).id;
}
function addCard(id){
  const isNew=!owned(id);
  if(owned(id)>=RAR[CARD[id].rarity].max){const d=RAR[CARD[id].rarity].mill;S.dust+=d;return {isNew:false,dust:d}}
  S.coll[id]=owned(id)+1;return {isNew,dust:0};
}
function openPack(){
  if(S.shards<RULES.packCost){toast('Za mało odłamków. Zagraj partię!');return}
  S.shards-=RULES.packCost;
  const cards=[0,1,2,3].map(()=>{const id=rollId('C');return {id,open:false,...addCard(id)}});
  const ch=[];for(let g=0;ch.length<3&&g<60;g++){const id=rollId('R');if(!ch.includes(id))ch.push(id)}
  persist();PK={cards,choices:ch,picked:null,done:false,res:null};render();
}
const badge=r=>r.isNew?'<span class="badge new">NOWA</span>':r.dust?`<span class="badge dup">+${r.dust}✨</span>`:'';

    const list=CARDS.filter(c=>CV.filter==='all'||c.world===CV.filter).sort((a,b)=>a.cost-b.cost||a.name.localeCompare(b.name));
    body=`<div class="chips">${[['all','Wszystkie'],...Object.entries(WORLDS).map(([k,v])=>[k,v.i+' '+v.n])].map(([k,l])=>`<button class="${CV.filter===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>

        <button class="btn sec" data-act="craft" data-id="${c.id}" ${o<r.max&&S.dust>=r.craft?'':'disabled'}>Stwórz −${r.craft}✨</button>
        <button class="btn sec" data-act="mill" data-id="${c.id}" ${o?'':'disabled'}>Rozbij +${r.mill}✨</button>
      </div>${c.world==='neutral'?`<p>Neutralna: trafia do talii ${WORLDS[dw].n} (zmień w zakładce Talie)</p>`:''}

function mkPlayer(world,deck){return {world,leader:leaderOf(world),hp:RULES.leaderHp,maxHp:RULES.leaderHp,armor:0,mana:0,max:0,deck:shuffle([...deck]),hand:[],board:[],fat:0,powerUsed:false,madness:false,force:0,heroes:0}}
function mkUnit(c){const kw=[...(c.kw||[])];return {uid:UID++,id:c.id,art:artSrc(c),name:c.name,icon:c.icon,world:c.world,src:c.src,race:c.race,atk:c.atk,hp:c.hp,maxHp:c.hp,baseAtk:c.atk,baseHp:c.hp,kw,canAttack:kw.includes('charge'),attacked:false,frozen:false,webbed:false}}
const worldKey=u=>u.src||u.world;
function fx(k,t,c){G.fxq.push({k,t,c})}
function setLog(m){G.log=m}
function findUnit(uid){for(let p=0;p<2;p++){const u=G.p[p].board.find(x=>x.uid===uid);if(u)return {u,p}}return null}
const keyOf=t=>t.kind==='leader'?'L'+t.p:'U'+t.u.uid;
function parseKey(k){if(!k)return null;if(k[0]==='L')return {kind:'leader',p:+k.slice(1)};const f=findUnit(+k.slice(1));return f?{kind:'unit',u:f.u,p:f.p}:null}
const unitsOf=q=>G.p[q].board.map(u=>({kind:'unit',u,p:q}));
const clones=p=>G.p[p].board.filter(u=>u.id==='klon').length;
const races=p=>new Set(G.p[p].board.map(u=>u.race).filter(Boolean)).size;
const worldsOn=p=>new Set(G.p[p].board.map(worldKey)).size;
function costOf(p,c){let k=c.cost;if(c.costMod==='clones'&&G&&p!=null)k-=clones(p);return Math.max(0,k)}
function effN(p,e){if(e.n==='force')return G.p[p].force;return (e.n||0)+(e.plusClones?clones(p):0)}
function validTargets(t,p){
  if(t==='any')return [...unitsOf(0),...unitsOf(1),{kind:'leader',p:0},{kind:'leader',p:1}];
  if(t==='enemyUnit')return unitsOf(1-p);
  if(t==='friendlyUnit')return unitsOf(p);
  return [];
}
function validAttack(p){
  const o=1-p, taunts=G.p[o].board.filter(u=>u.kw.includes('taunt'));
  if(taunts.length)return taunts.map(u=>({kind:'unit',u,p:o}));
  return [...unitsOf(o),{kind:'leader',p:o}];
}
function canPlay(p,c){
  const pl=G.p[p];
  if(costOf(p,c)>pl.mana)return false;
  if(c.type==='unit')return pl.board.length<RULES.boardMax;
  if(c.play&&TARGETED.has(c.play.t))return validTargets(c.play.t,p).length>0;
  return true;
}
function condMet(p,cond){
  const pl=G.p[p];
  if(cond.type==='party')return races(p)>=cond.n;
  if(cond.type==='force')return pl.force>=cond.n;
  if(cond.type==='assemble')return pl.heroes>=1;
  return false;
}
function damageUnit(u,n){if(n<=0)return;u.hp-=n;fx('U'+u.uid,'-'+n,'dmg')}
function damageLeader(p,n){if(n<=0)return;const pl=G.p[p],a=Math.min(pl.armor,n);pl.armor-=a;pl.hp-=n-a;fx('L'+p,'-'+n,'dmg')}
function healLeader(p,n){const pl=G.p[p];pl.hp=Math.min(pl.maxHp,pl.hp+n);fx('L'+p,'+'+n,'heal')}
function healUnit(u,n){u.hp=Math.min(u.maxHp,u.hp+n);fx('U'+u.uid,'+'+n,'heal')}
function hit(t,n){t.kind==='leader'?damageLeader(t.p,n):damageUnit(t.u,n)}
function buffUnit(u,a,h){u.atk+=a;u.hp+=h;u.maxHp+=h;fx('U'+u.uid,`+${a}/+${h}`,'heal')}
function giveKw(u,kw){if(!u.kw.includes(kw))u.kw.push(kw);if(kw==='charge'&&!u.attacked&&!u.frozen)u.canAttack=true}

function applyFx(p,e,target,src){
  const o=1-p, me=G.p[p], op=G.p[o], n=effN(p,e), self=src?findUnit(src):null;
  switch(e.fx){
    case 'dmg':
      if(e.t==='enemyLeader')damageLeader(o,n);
      else if(e.t==='allEnemyUnits')op.board.forEach(u=>damageUnit(u,n));
      else if(e.t==='allEnemies'){op.board.forEach(u=>damageUnit(u,n));damageLeader(o,n)}
      else if(target)hit(target,n);
      break;
    case 'heal':
      if(e.t==='myLeader')healLeader(p,n);
      else if(e.t==='allFriendlyUnits')me.board.forEach(u=>healUnit(u,n));
      else if(target)target.kind==='leader'?healLeader(target.p,n):healUnit(target.u,n);
      break;
    case 'buff': if(target&&target.u){buffUnit(target.u,e.a,e.h);if(e.kw)giveKw(target.u,e.kw)} break;
    case 'buffAll': me.board.forEach(u=>buffUnit(u,e.a,e.h)); break;
    case 'buffClones': me.board.filter(u=>u.id==='klon').forEach(u=>buffUnit(u,e.a,e.h)); break;
    case 'selfBuff': if(self)buffUnit(self.u,e.a,e.h); break;
    case 'selfKw': if(self){giveKw(self.u,e.kw);fx('U'+src,'Szarża!','info')} break;
    case 'shield': if(target&&target.u){const u=target.u;u.hp+=2;u.maxHp+=2;giveKw(u,'taunt');fx(keyOf(target),'+2 HP','heal')} break;
    case 'summon': {const t=TOKENS[e.token];for(let i=0;i<n;i++){if(me.board.length>=RULES.boardMax)break;me.board.push(mkUnit(t));if(t.world==='marvel'&&me.world==='marvel')me.heroes++}break}
    case 'draw': for(let i=0;i<(n||1);i++)draw(p); break;
    case 'destroy': if(target&&target.u){target.u.hp=0;fx(keyOf(target),'✖','dmg')} break;
    case 'freeze': if(target&&target.u){target.u.frozen=true;target.u.canAttack=false;fx(keyOf(target),'Unieruchomiony','info')} break;
    case 'armor': me.armor+=n;fx('L'+p,`+${n} pancerza`,'heal'); break;
    case 'wipeEnemy': op.board.forEach(u=>u.hp=0); break;
    case 'wipe': [...me.board,...op.board].forEach(u=>u.hp=0); break;
    case 'snap': {const pool=shuffle([...me.board,...op.board].filter(u=>u.uid!==src));pool.slice(0,Math.ceil(pool.length/2)).forEach(u=>u.hp=0);if(src)fx('U'+src,'PSTRYK','info');break}
  }
}
function draw(p){
  const pl=G.p[p];
  if(!pl.deck.length){pl.fat++;damageLeader(p,pl.fat);setLog(`${p?'AI':'Ty'}: pusta talia, -${pl.fat} HP`);return}
  const id=pl.deck.pop();
  if(pl.hand.length>=RULES.handMax){if(p===0)toast(`Pełna ręka: ${CARD[id].name} przepada`);return}
  pl.hand.push({uid:UID++,id});
}
function cleanup(){
  for(const pl of G.p)pl.board=pl.board.filter(u=>u.hp>0);
  if(G.sel&&!findUnit(G.sel))G.sel=null;
  if(G.pending&&G.pending.src&&!findUnit(G.pending.src)&&G.pending.eff.fx.startsWith('self'))G.pending=null;
  const a=G.p[0].hp<=0,b=G.p[1].hp<=0;
  if((a||b)&&!G.over){
    const res=a&&b?'draw':b?'win':'lose', rw=RULES.reward[res];
    S.shards+=rw;if(res==='win')S.wins++;if(res==='lose')S.losses++;persist();
    G.over={res,rw};G.pending=null;G.sel=null;
  }
}
function gainForce(p){const pl=G.p[p];pl.force++;fx('L'+p,`✦ Moc ${pl.force}`,'info')}
function playCard(p,idx,target){
  const pl=G.p[p], c=CARD[pl.hand[idx].id];
  if(G.over||G.turn!==p||!canPlay(p,c))return false;
  pl.mana-=costOf(p,c);pl.hand.splice(idx,1);
  setLog(`${p?'AI':'Ty'}: ${c.name}`);
  if(c.force)gainForce(p);
  if(c.type==='unit'){
    const u=mkUnit(c);pl.board.push(u);
    const effs=[];
    if(c.play)effs.push(c.play);
    if(c.cond&&condMet(p,c.cond)){effs.push(c.cond.play);fx('U'+u.uid,COND[c.cond.type]+'!','info')}
    if(c.world==='marvel')pl.heroes++;
    let targeted=null;
    for(const e of effs){
      if(TARGETED.has(e.t)){targeted=e;continue}
      applyFx(p,e,null,u.uid);
    }
    if(targeted&&validTargets(targeted.t,p).length){
      if(p===0){G.pending={kind:'bc',eff:targeted,src:u.uid,name:c.name};cleanup();return true}
      const t=aiTarget(targeted,p);if(t)applyFx(p,targeted,t,u.uid);
    }
  } else applyFx(p,c.play,target,null);
  cleanup();return true;
}
function attack(p,uid,t){
  const f=findUnit(uid);if(!f||f.p!==p||!t||G.turn!==p||G.over)return false;
  const u=f.u;if(!u.canAttack)return false;
  if(!validAttack(p).map(keyOf).includes(keyOf(t)))return false;
  u.canAttack=false;u.attacked=true;
  if(t.kind==='leader'){damageLeader(t.p,u.atk);setLog(`${u.name} bije Lidera za ${u.atk}`)}
  else{const d=t.u;damageUnit(d,u.atk);damageUnit(u,d.atk);setLog(`${u.name} ⚔ ${d.name}`)}
  cleanup();return true;
}
function usePower(p,t){
  const pl=G.p[p], pw=pl.leader.power;
  if(pl.powerUsed||pl.mana<RULES.powerCost||G.turn!==p||G.over)return false;
  if(TARGETED.has(pw.t)&&!t)return false;
  if(pw.fx==='summon'&&pl.board.length>=RULES.boardMax)return false;
  pl.mana-=RULES.powerCost;pl.powerUsed=true;
  applyFx(p,pw,t,null);if(pw.force)gainForce(p);
  setLog(`${p?'AI':'Ty'}: ${pw.name}`);cleanup();return true;
}
function startTurn(p){
  const pl=G.p[p];G.turn=p;
  pl.max=Math.min(RULES.maxMana,pl.max+1);pl.mana=pl.max;pl.powerUsed=false;pl.heroes=0;
  pl.madness=worldsOn(p)>=3;
  if(pl.madness){pl.mana++;fx('L'+p,'MADNESS +1 mana','info')}
  pl.board.forEach(u=>{u.webbed=u.frozen;u.canAttack=!u.frozen;u.attacked=false;u.frozen=false});
  draw(p);cleanup();
  banner(p===0?(pl.madness?'Twoja tura · Madness!':'Twoja tura'):'Tura przeciwnika');
}
function endTurn(){
  if(G.over)return;
  G.sel=null;G.pending=null;
  G.p[G.turn].board.forEach(u=>u.webbed=false);
  const n=1-G.turn;startTurn(n);render();
  if(n===1&&!G.over)runAI();
}
function newGame(w){
  const aiW=pick(PLAYABLE.filter(x=>x!==w));
  G={p:[mkPlayer(w,S.decks[w]),mkPlayer(aiW,starterDeckOf(aiW))],turn:0,over:null,busy:false,pending:null,sel:null,preview:null,menu:false,log:'',fxq:[]};
  const first=Math.random()<.5?0:1;
  for(let i=0;i<3;i++)draw(first);for(let i=0;i<4;i++)draw(1-first);
  G.log=`${WORLDS[w].n} vs ${WORLDS[aiW].n}. ${first===0?'Zaczynasz!':'Zaczyna przeciwnik, masz dodatkową kartę.'}`;
  screen='game';startTurn(first);render();
  if(first===1)runAI();
}

/* ---------- AI ---------- */
function aiTarget(e,p){
  const o=1-p, op=G.p[o], me=G.p[p], byAtk=(a,b)=>b.atk-a.atk, n=effN(p,e);
  switch(e.fx){
    case 'dmg':{const kill=op.board.filter(u=>u.hp<=n).sort(byAtk)[0];if(kill)return {kind:'unit',u:kill,p:o};
      if(e.t==='any')return {kind:'leader',p:o};const big=[...op.board].sort(byAtk)[0];return big?{kind:'unit',u:big,p:o}:null}
    case 'heal':{if(me.hp<=me.maxHp-3)return {kind:'leader',p};const h=me.board.filter(u=>u.hp<=u.maxHp-2).sort(byAtk)[0];return h?{kind:'unit',u:h,p}:null}
    case 'buff':case 'shield':{const u=[...me.board].sort(byAtk)[0];return u?{kind:'unit',u,p}:null}
    case 'destroy':case 'freeze':{const u=[...op.board].sort((a,b)=>(b.atk+b.hp)-(a.atk+a.hp))[0];return u?{kind:'unit',u,p:o}:null}
  } return null;
}
function aiWants(c){
  const me=G.p[1], op=G.p[0];
  if(c.type==='spell'){
    if(TARGETED.has(c.play.t))return !!aiTarget(c.play,1);
    if(c.play.fx==='wipe')return op.board.length>=me.board.length+2;
    if(c.play.fx==='buffAll')return me.board.length>=2;
    if(c.play.fx==='summon')return me.board.length<RULES.boardMax;
  }
  return true;
}
function aiAttackTarget(u){
  const vt=validAttack(1), op=G.p[0], leader=vt.find(t=>t.kind==='leader');
  const ready=G.p[1].board.filter(x=>x.canAttack).reduce((s,x)=>s+x.atk,0);
  if(leader&&ready>=op.hp+op.armor)return leader;
  const units=vt.filter(t=>t.kind==='unit');
  const clean=units.filter(t=>t.u.hp<=u.atk&&t.u.atk<u.hp).sort((a,b)=>b.u.atk-a.u.atk)[0];if(clean)return clean;
  const trade=units.filter(t=>t.u.hp<=u.atk&&(t.u.atk+t.u.hp)>(u.atk+u.hp)+1).sort((a,b)=>b.u.atk-a.u.atk)[0];if(trade)return trade;
  if(leader)return leader;
  return units.sort((a,b)=>a.u.hp-b.u.hp)[0]||null;
}
async function runAI(){
  G.busy=true;render();await sleep(900);
  const me=G.p[1];
  const tryPower=async()=>{
    if(G.over||me.mana<RULES.powerCost||me.powerUsed)return;
    const pw=me.leader.power;let t=null,ok=true;
    if(TARGETED.has(pw.t)){t=aiTarget(pw,1);ok=!!t}
    if(ok&&usePower(1,t)){render();await sleep(800)}
  };
  if(me.world==='marvel'||me.world==='naruto')await tryPower(); // Agent/Klony przed kartami: Zbiórka i tańszy Kurama
  for(let g=0;g<12&&!G.over&&screen==='game';g++){
    const opts=me.hand.map((h,i)=>({c:CARD[h.id],i})).filter(o=>canPlay(1,o.c)&&aiWants(o.c)).sort((a,b)=>costOf(1,b.c)-costOf(1,a.c));
    if(!opts.length)break;
    const {c,i}=opts[0];
    const t=c.type==='spell'&&TARGETED.has(c.play.t)?aiTarget(c.play,1):null;
    playCard(1,i,t);render();await sleep(900);
  }
  await tryPower();
  for(const u of [...me.board]){
    if(G.over||screen!=='game')break;
    if(!findUnit(u.uid)||!u.canAttack||u.atk<=0)continue;
    const t=aiAttackTarget(u);if(!t)continue;
    attack(1,u.uid,t);render();await sleep(750);
  }
  G.busy=false;
  if(screen!=='game')return;
  if(!G.over)endTurn();else render();
}

/* ---------- render gry ---------- */
function targetKeys(){
  if(G.pending){const t=G.pending.kind==='bc'?G.pending.eff.t:G.p[0].leader.power.t;return new Set(validTargets(t,0).map(keyOf))}
  if(G.sel)return new Set(validAttack(0).map(keyOf));
  return new Set();
}
function mechStatus(p){
  const pl=G.p[p];
  const m={lotr:[`Drużyna ${races(p)}/3`,races(p)>=3],sw:[`Moc ${pl.force}`,pl.force>=3],marvel:[`Zbiórka ${pl.heroes}`,pl.heroes>=1],naruto:[`Klony ${clones(p)}`,clones(p)>0]}[pl.world];
  return `<span class="mad ${m[1]?'on':''}">${m[0]}</span> · <span class="mad ${worldsOn(p)>=3?'on':''}">Madness ${worldsOn(p)}/3</span>`;
}
function leaderBar(p,tg,myTurn){
  const pl=G.p[p], L=pl.leader, k='L'+p, a=artSrc(L);
  const crys=Array.from({length:RULES.maxMana},(_,i)=>`<i class="${i<pl.mana?'f':i<pl.max?'e':''}"></i>`).join('');
  const right=p===0
    ?`<button class="pow" data-act="power" ${myTurn&&!G.busy&&!pl.powerUsed&&pl.mana>=RULES.powerCost&&!G.pending?'':'disabled'}><span>${L.power.name}</span><i>2🔷</i></button>`
    :`<div class="epow">${WORLDS[pl.world].n}<br>Ręka: ${pl.hand.length} · Talia ${pl.deck.length}</div>`;
  return `<div class="lb">
    <div class="por ${tg.has(k)?'tgt':''}" data-tgt="${k}" data-k="${k}" data-leader="${p}" style="--u:var(--${L.world})">${L.icon}${a?artImg(a):''}<span class="hp">${pl.hp}</span>${pl.armor?`<span class="ar">${pl.armor}</span>`:''}</div>
    <div class="li"><b>${p?'AI · ':''}${L.name}</b><div class="mana"><b>${pl.mana}/${pl.max}</b>${crys}</div>
    <small>${mechStatus(p)}${p?'':` · Talia ${pl.deck.length}`}</small></div>${right}</div>`;
}
function unitHTML(u,owner,tg,myTurn){
  const k='U'+u.uid;
  const cls=['unit',u.art?'has-art':'',u.kw.includes('taunt')?'taunt':'',owner===0&&myTurn&&!G.busy&&u.canAttack&&!G.pending?'ready':'',G.sel===u.uid?'sel':'',tg.has(k)?'tgt':''].join(' ');
  return `<div class="${cls}" data-uid="${u.uid}" data-owner="${owner}" data-tgt="${k}" data-k="${k}" style="--u:var(--${u.world})">
    ${u.art?artImg(u.art):''}<span class="ui">${u.icon}</span><span class="nm">${u.name}</span>
    ${u.kw.includes('charge')?'<span class="kw">⚡</span>':''}
    <span class="at ${u.atk>u.baseAtk?'up':''}">${u.atk}</span><span class="hpx ${u.hp<u.maxHp?'hurt':u.maxHp>u.baseHp?'up':''}">${u.hp}</span>
    ${u.frozen||u.webbed?'<span class="web">🕸️</span>':''}</div>`;
}
function renderGame(){
  const me=G.p[0], ai=G.p[1], myTurn=G.turn===0&&!G.over, tg=targetKeys();
  const anyMove=myTurn&&(me.hand.some(h=>canPlay(0,CARD[h.id]))||me.board.some(u=>u.canAttack)||(!me.powerUsed&&me.mana>=2));
  const W=Math.max(200,app.clientWidth), n=me.hand.length, cw=64, step=n>1?Math.min(68,(W-cw)/(n-1)):0;
  let mid;
  if(G.pending){
    const nm=G.pending.kind==='bc'?G.pending.name:me.leader.power.name;
    mid=`<div class="pend">🎯 ${nm}: wybierz cel</div><button class="smallb" data-act="cancel">${G.pending.kind==='bc'?'Pomiń':'Anuluj'}</button>`;
  } else {
    mid=`<button class="smallb" data-act="gmenu" aria-label="Menu gry">☰</button><div class="log">${G.log||''}</div>
      <button class="endb ${anyMove?'':'hot'}" data-act="end" ${myTurn&&!G.busy?'':'disabled'}>${G.busy?'Tura AI…':'Koniec tury'}</button>`;
  }
  let over='';
  if(G.over){const r=G.over.res;over=`<div class="ov"><h2>${r==='win'?'Zwycięstwo!':r==='lose'?'Porażka':'Remis'}</h2><p>+${G.over.rw} 🔹 odłamków (masz ${S.shards})</p>
    <div class="col"><button class="btn" data-act="again">Jeszcze raz</button><button class="btn sec" data-act="packs">Paczki</button><button class="btn sec" data-act="menu">Menu</button></div></div>`}
  else if(G.menu){over=`<div class="ov"><h2>Pauza</h2><div class="col"><button class="btn" data-act="gmenu">Wróć do gry</button><button class="btn sec" data-act="${G.menu==='sure'?'surrender2':'surrender'}">${G.menu==='sure'?'Na pewno? Dotknij jeszcze raz':'Poddaj się'}</button></div></div>`}
  else if(G.preview){const pc=CARD[G.preview]||(TOKENS[G.preview]&&{...TOKENS[G.preview],cost:0,rarity:'C'});over=`<div class="ov">${cardFace(pc,'lg')}<p>Dotknij, aby zamknąć</p></div>`}
  app.innerHTML=`<div class="game">
    ${leaderBar(1,tg,myTurn)}
    <div class="board enemy">${ai.board.map(u=>unitHTML(u,1,tg,myTurn)).join('')||'<span class="empty">Pusto</span>'}</div>
    <div class="mid">${mid}</div>
    <div class="board mine" id="myboard">${me.board.map(u=>unitHTML(u,0,tg,myTurn)).join('')||'<span class="empty">Przeciągnij tu kartę</span>'}</div>
    ${leaderBar(0,tg,myTurn)}
    <div class="hand" id="hand">${me.hand.map((h,i)=>{const c=CARD[h.id];return `<div class="hc ${myTurn&&!G.busy&&!G.pending&&canPlay(0,c)?'ok':''}" data-hand="${i}" style="z-index:${i};${i?`margin-left:${step-cw}px`:''}">${cardFace(c,'sm','',costOf(0,c))}</div>`}).join('')}</div>
  </div>${over}`;
  flushFx();
}
function flushFx(){
  const q=G.fxq;G.fxq=[];const cnt={};
  q.forEach(f=>{
    const el=app.querySelector(`[data-k="${f.k}"]`);if(!el)return;
    const i=cnt[f.k]=(cnt[f.k]||0)+1;
    const s=document.createElement('span');s.className='pop '+f.c;s.textContent=f.t;s.style.setProperty('--d',(i-1)*18+'px');
    el.appendChild(s);
    if(f.c==='dmg'){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
    setTimeout(()=>s.remove(),1000);
  });
}

/* ---------- dotyk: przeciąganie ---------- */
let drag=null, swallow=false, ghost=null, arrow=null;
function clearDragVisual(){
  if(ghost){ghost.remove();ghost=null}
  if(arrow){arrow.remove();arrow=null}
  app.querySelectorAll('.tgt,.drop,.lift').forEach(e=>e.classList.remove('tgt','drop','lift'));
}
function markTargets(keys){keys.forEach(k=>{const el=app.querySelector(`[data-tgt="${k}"]`);if(el)el.classList.add('tgt')})}
app.addEventListener('pointerdown',e=>{
  swallow=false;
  if(screen!=='game'||!G)return;
  if(G.preview){G.preview=null;swallow=true;render();return}
  if(G.over||G.menu||G.busy||G.turn!==0||G.pending)return;
  const h=e.target.closest('[data-hand]'), u=e.target.closest('.unit[data-owner="0"]');
  if(h)drag={kind:'hand',idx:+h.dataset.hand,el:h,x0:e.clientX,y0:e.clientY,moved:false};
  else if(u){const f=findUnit(+u.dataset.uid);if(f&&f.u.canAttack)drag={kind:'unit',uid:+u.dataset.uid,el:u,x0:e.clientX,y0:e.clientY,moved:false}}
  if(drag){try{drag.el.setPointerCapture(e.pointerId)}catch(_){}}
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<9)return;
    drag.moved=true;G.sel=null;
    if(drag.kind==='hand'){
      const c=CARD[G.p[0].hand[drag.idx].id];
      ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=cardFace(c,'md','',costOf(0,c));document.body.appendChild(ghost);
      drag.el.classList.add('lift');
      if(c.type==='spell'&&TARGETED.has(c.play.t))markTargets(validTargets(c.play.t,0).map(keyOf));
      else app.querySelector('#myboard').classList.add('drop');
    } else {
      const r=drag.el.getBoundingClientRect();drag.cx=r.left+r.width/2;drag.cy=r.top+r.height/2;
      arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('class','arrow');
      arrow.innerHTML=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c9a45c"/></marker></defs><line stroke="#c9a45c" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#ah)"/>`;
      document.body.appendChild(arrow);drag.el.classList.add('sel');
      markTargets(validAttack(0).map(keyOf));
    }
  }
  if(ghost)ghost.style.transform=`translate(${e.clientX-52}px,${e.clientY-120}px) rotate(${Math.max(-8,Math.min(8,dx/20))}deg)`;
  if(arrow){const l=arrow.querySelector('line');l.setAttribute('x1',drag.cx);l.setAttribute('y1',drag.cy);l.setAttribute('x2',e.clientX);l.setAttribute('y2',e.clientY)}
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.moved)return;
  swallow=true;
  if(ghost)ghost.style.display='none';if(arrow)arrow.style.display='none';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tEl=el&&el.closest('[data-tgt]');
  clearDragVisual();
  if(d.kind==='hand'){
    const c=CARD[G.p[0].hand[d.idx].id];
    const handTop=app.querySelector('#hand').getBoundingClientRect().top;
    if(!canPlay(0,c)){if(e.clientY<handTop-10)toast(costOf(0,c)>G.p[0].mana?'Za mało many':c.type==='unit'?'Stół jest pełny':'Brak celu');render();return}
    if(c.type==='spell'&&TARGETED.has(c.play.t)){
      const t=tEl&&parseKey(tEl.dataset.tgt);
      if(t&&validTargets(c.play.t,0).map(keyOf).includes(keyOf(t)))playCard(0,d.idx,t);
      else if(e.clientY<handTop-10)toast('Upuść zaklęcie na podświetlony cel');
    } else if(e.clientY<handTop-10)playCard(0,d.idx,null);
  } else {
    const t=tEl&&parseKey(tEl.dataset.tgt);
    if(t&&!attack(0,d.uid,t)&&t.p===1)toast('Najpierw zbij jednostkę z Prowokacją');
  }
  render();
});
window.addEventListener('pointercancel',()=>{if(drag){drag=null;clearDragVisual();if(G)render()}});

/* ---------- kliknięcia ---------- */
app.addEventListener('click',e=>{
  if(swallow){swallow=false;return}
  const a=e.target.closest('[data-act]');
  if(a)return doAct(a.dataset.act,a.dataset);
  if(screen!=='game'||!G||G.over||G.menu)return;
  const t=e.target.closest('[data-tgt]');
  if(G.pending){
    if(!t)return;
    const tt=parseKey(t.dataset.tgt);if(!tt||!targetKeys().has(keyOf(tt)))return;
    if(G.pending.kind==='bc'){const pd=G.pending;G.pending=null;applyFx(0,pd.eff,tt,pd.src);cleanup()}
    else{G.pending=null;usePower(0,tt)}
    render();return;
  }
  if(G.sel&&t){
    const tt=parseKey(t.dataset.tgt);
    if(tt&&tt.p===1){if(!attack(0,G.sel,tt))toast('Najpierw zbij jednostkę z Prowokacją');G.sel=null;render();return}
  }
  const h=e.target.closest('[data-hand]');
  if(h){G.sel=null;G.preview=G.p[0].hand[+h.dataset.hand].id;render();return}
  const u=e.target.closest('.unit');
  if(u){
    const f=findUnit(+u.dataset.uid);if(!f)return;
    if(f.p===0&&G.turn===0&&!G.busy&&f.u.canAttack){G.sel=G.sel===f.u.uid?null:f.u.uid;render();return}
    G.sel=null;G.preview=f.u.id;render();return;
  }
  const l=e.target.closest('[data-leader]');
  if(l){const L=G.p[+l.dataset.leader].leader;toast(`${L.name} · ${L.power.name}: ${L.power.text}`);return}
  if(G.sel){G.sel=null;render()}
});

function doAct(act,ds){
  const id=ds.id, dw=CV.deckWorld;
  switch(act){
    case 'noop': return;
    case 'menu': screen='menu';G=null;if(PK&&PK.done)PK=null;render();break;
    case 'play': case 'again': screen='leaders';G=null;render();break;
    case 'pick-world': if(deckOk(ds.w))newGame(ds.w);else{CV.tab='deck';CV.deckWorld=ds.w;screen='coll';render()}break;
    case 'rules': screen='rules';render();break;
    case 'packs': G=null;screen='pack';if(PK&&PK.done)PK=null;render();break;
    case 'coll': G=null;screen='coll';CV.open=null;if(PK&&PK.done)PK=null;render();break;
    case 'open': openPack();break;
    case 'flip': PK.cards[+ds.i].open=true;render();break;
    case 'flipall': PK.cards.forEach(c=>c.open=true);render();break;
    case 'choose': PK.picked=id;render();break;
    case 'take': if(PK.picked){PK.res=addCard(PK.picked);PK.done=true;persist();render()}break;
    case 'tab': CV.tab=ds.t;render();break;
    case 'filter': CV.filter=ds.f;if(PLAYABLE.includes(ds.f))CV.deckWorld=ds.f;render();break;
    case 'deckworld': CV.deckWorld=ds.w;render();break;
    case 'card': CV.open=id;render();break;
    case 'close': CV.open=null;render();break;
    case 'add': {const w=CARD[id].world==='neutral'?dw:CARD[id].world;if(canAddTo(id,w)){S.decks[w].push(id);persist()}render();break}
    case 'remove': {const w=CARD[id].world==='neutral'?dw:CARD[id].world, d=S.decks[w], i=d.indexOf(id);if(i>=0){d.splice(i,1);persist()}render();break}
    case 'craft': {const r=RAR[CARD[id].rarity];if(owned(id)<r.max&&S.dust>=r.craft){S.dust-=r.craft;S.coll[id]=owned(id)+1;persist();toast(`Stworzono: ${CARD[id].name}`)}render();break}
    case 'mill': {const r=RAR[CARD[id].rarity];if(owned(id)){S.coll[id]--;S.dust+=r.mill;PLAYABLE.forEach(w=>{while(inDeck(id,w)>owned(id))S.decks[w].splice(S.decks[w].indexOf(id),1)});persist();toast(`+${r.mill} ✨ Pyłu`)}render();break}
    case 'reset-deck': {const d=starterDeckOf(dw);d.forEach(x=>{const k=d.filter(y=>y===x).length;if(owned(x)<k)S.coll[x]=k});S.decks[dw]=d;persist();render();break}
    case 'end': if(G&&G.turn===0&&!G.busy&&!G.pending)endTurn();break;
    case 'power': {
      const pl=G.p[0],pw=pl.leader.power;
      if(TARGETED.has(pw.t)){if(!validTargets(pw.t,0).length){toast('Brak celu dla zdolności');return}G.sel=null;G.pending={kind:'pw'};render()}
      else{if(!usePower(0,null))toast('Stół jest pełny');render()}
      break;}
    case 'cancel': G.pending=null;render();break;
    case 'gmenu': G.menu=G.menu?false:true;render();break;
    case 'surrender': G.menu='sure';render();break;
    case 'surrender2': G.menu=false;G.p[0].hp=0;cleanup();render();break;
  }
}
window.addEventListener('resize',()=>{if(screen==='game'&&!drag)render()});
render();
resolveArt();
</script>
